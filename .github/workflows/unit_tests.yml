name: Unit tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]

job:
  run_tests:
    name: Run Tests
    runs-on: ubuntu-latest
    step:
      - name: Install Godot
      - uses: lihop/setup-godot@v3
        with:
          version: 4.7-stable
      - run: godot --import --headless -s addons/gut/gut_cmdln.gd --quit

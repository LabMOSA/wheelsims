name: Unit tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]

jobs:
  run_tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: lihop/setup-godot@v3
        with:
          version: 4.7-stable
      - run: godot --import -d -s --path "$PWD" addons/gut/gut_cmdln.gd -gdir "tests" --quit

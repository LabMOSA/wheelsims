- name: Unit Tests
  uses: lihop/setup-godot@v3
  with:
    version: 4.7-stable

# You can now run the downloaded version of godot using the `godot` command in your other steps.
# For example, run Gut tests:
- name: Run tests
  shell: bash
  run: godot --import --headless -s addons/gut/gut_cmdln.gd --quit
